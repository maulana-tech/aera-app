schema_version: 3.28.0

metadata:
  namespace: joule.ext
  name: sigap_capability
  version: 1.0.0
  display_name: SIGAP_Supply_Disruption
  description: >-
    SIGAP, the supply disruption assistant. Start an investigation of a supply
    disruption, follow how it is going, and scan for supply risk ahead.
    Approvals happen on SIGAP web, never in Joule.

system_aliases:
  SIGAP_AGENT:
    destination: __SIGAP_DESTINATION__
