description: >-
  This skill starts an investigation of a supply disruption with SIGAP: a port
  closure, a typhoon, a strike, a supplier that missed or cancelled a shipment,
  goods held at customs, or a quality hold on incoming material. Use it when the
  user reports a disruption or asks SIGAP to investigate, look into, or handle
  one, for example "Ningbo port is closed for six days" or "investigate the
  delayed shipment from SUP-2207". It answers at once with the run id and a link
  to the run on SIGAP web.
target:
  name: investigate_disruption_function
  type: function
visibility_condition:
  objects:
    - type: ias_attributes
      attributes:
        - attribute: groups
          match: "ANY"
          values:
            - __TEAM_IAS_GROUP_ID__
