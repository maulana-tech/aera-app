[package]
name = "aera-vault"
version = "0.1.0"
edition = "2021"
description = "AERA autonomous-business vault: capped agent payments, human approvals, order intake and revenue split"
license = "MIT"
repository = "https://github.com/maulana-tech/aera"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `cargo test --features sandbox --test sandbox` runs tests/sandbox.rs (needs prebuilt wasm, see README).
sandbox = []

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", default-features = false, features = ["rustls"] }  # no build-time sandbox download; set NEAR_SANDBOX_BIN_PATH or let it install at runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde_json = "1"

[[test]]
name = "sandbox"
required-features = ["sandbox"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
