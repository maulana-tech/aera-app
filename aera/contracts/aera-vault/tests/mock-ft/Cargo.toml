[package]
name = "mock-ft"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone crate (test fixture only): a minimal NEP-141 token used by ../sandbox.rs.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
