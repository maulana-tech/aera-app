services:
  # Agent service (Python, standard library only). Its record is one SQLite file.
  agents:
    image: ${IMAGE_AGENTS:-aera-agents:local}
    build:
      context: ./aera/agent
      dockerfile: Dockerfile
    container_name: aera-agents
    restart: always
    environment:
      - AERA_HOST=0.0.0.0
      - PORT=8787
      - AERA_ENV=${AERA_ENV:-dev}
      - AERA_DB=/app/data/aera.db
    env_file:
      - ./aera/agent/.env
    volumes:
      - agent_data:/app/data
      - ./aera/agent/.secrets:/app/.secrets:ro
    networks:
      - aera_network

  # Web app (Next.js standalone).
  aera:
    image: ${IMAGE_WEB:-aera-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aera-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AERA_API=http://agents:8787
    networks:
      - aera_network
    depends_on:
      - agents

volumes:
  agent_data:
    driver: local

networks:
  aera_network:
    driver: bridge
