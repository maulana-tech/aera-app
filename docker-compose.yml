services:
  # 1. Database Service (PostgreSQL)
  database:
    image: postgres:16-alpine
    container_name: sigap-database
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigap}
      POSTGRES_USER: ${POSTGRES_USER:-sigap}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sigap_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigap} -d ${POSTGRES_DB:-sigap}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Agent Backend Service (Python API)
  agents:
    image: ${IMAGE_AGENTS:-sigap-agents:local}
    build:
      context: ./sigap/agent
      dockerfile: Dockerfile
    container_name: sigap-agents
    restart: always
    environment:
      - SIGAP_HOST=0.0.0.0
      - PORT=8787
      - SIGAP_ENV=${SIGAP_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-sigap}@database:5432/${POSTGRES_DB:-sigap}
      - SIGAP_DB=/app/data/sigap.db
    env_file:
      - ./sigap/agent/.env
    volumes:
      - agent_data:/app/data
    networks:
      - sigap_network
    depends_on:
      database:
        condition: service_healthy

  # 3. Web Frontend Service (Next.js Standalone)
  sigap:
    image: ${IMAGE_WEB:-sigap-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigap-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SIGAP_API=http://agents:8787
    networks:
      - sigap_network
    depends_on:
      - agents

volumes:
  postgres_data:
    driver: local
  agent_data:
    driver: local

networks:
  sigap_network:
    driver: bridge

