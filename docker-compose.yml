services:
  # Agent service (Python, standard library only). Its record is one SQLite file.
  agents:
    image: ${IMAGE_AGENTS:-aera-agents:local}
    build:
      context: ./aera/agent
      dockerfile: Dockerfile
    container_name: aera-agents
    restart: always
    environment:
      - AERA_HOST=0.0.0.0
      - PORT=8787
      - AERA_ENV=${AERA_ENV:-dev}
      - AERA_DB=/app/data/aera.db
    env_file:
      - ./aera/agent/.env
    volumes:
      - agent_data:/app/data
      - ./aera/agent/.secrets:/app/.secrets:ro
    networks:
      - aera_network

  # Web app (Next.js standalone).
  aera:
    image: ${IMAGE_WEB:-aera-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aera-web
    restart: always
    ports:
      # AERA_WEB_PORT (root .env) when 3000 is taken on the host; only this machine reaches it.
      - "127.0.0.1:${AERA_WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AERA_API=http://agents:8787
      # Optional: the "Use the demo account" button on /login (a read-only viewer). From the root .env.
      - AERA_DEMO_EMAIL=${AERA_DEMO_EMAIL:-}
      - AERA_DEMO_PASSWORD=${AERA_DEMO_PASSWORD:-}
    networks:
      - aera_network
    depends_on:
      - agents

  # HTTPS in front of the web app (Let's Encrypt, renewed by Caddy). Only with: docker compose --profile https up -d
  # The login cookie is Secure in production, so a public install needs this (or another TLS proxy).
  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["https"]
    container_name: aera-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - AERA_DOMAIN=${AERA_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - aera_network
    depends_on:
      - aera

  # A public address on your own domain without opening a port: Cloudflare Tunnel (outbound only).
  # Only with: docker compose --profile tunnel up -d. The tunnel's public hostname points to http://aera:3000.
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["tunnel"]
    container_name: aera-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - aera_network
    depends_on:
      - aera

volumes:
  agent_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  aera_network:
    driver: bridge
