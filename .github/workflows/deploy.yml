name: CI and deploy EC2

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sigap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: node scripts/check-agent-output.mjs
      - run: npm run build -- --webpack
      - name: Python self-checks
        working-directory: sigap/agent
        env:
          SIGAP_ENV: dev
          SIGAP_DB: /tmp/sigap-ci.db
        run: python manage.py check
      - run: python3 ops/test_deploy.py
      - run: python3 ops/test_deploy_ssh.py

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Image Tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_web=ghcr.io/${OWNER}/sigap-web:latest" >> "$GITHUB_OUTPUT"
          echo "image_web_sha=ghcr.io/${OWNER}/sigap-web:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_agents=ghcr.io/${OWNER}/sigap-agents:latest" >> "$GITHUB_OUTPUT"
          echo "image_agents_sha=ghcr.io/${OWNER}/sigap-agents:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_web }}
            ${{ steps.meta.outputs.image_web_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Agents image
        uses: docker/build-push-action@v5
        with:
          context: ./sigap/agent
          file: ./sigap/agent/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_agents }}
            ${{ steps.meta.outputs.image_agents_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          IMAGE_WEB: ${{ steps.meta.outputs.image_web }}
          IMAGE_AGENTS: ${{ steps.meta.outputs.image_agents }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}
        run: bash ops/deploy-docker-ssh.sh
